{% extends "arches_urls.htm" %}

{% block arches_urls %}
{{ block.super }}
<div class="arches-urls"
    abac_rules="{% url 'abac_rules' %}"
    abac_rule='(ruleid) => {return "{% url "abac_rule" "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" %}".replace("aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa", ruleid)}'
    abac_rule_types="{% url 'abac_rule_types' %}"
    abac_resource_models="{% url 'abac_resource_models' %}"
    abac_resource_model_nodes='(graphid) => {return "{% url "abac_resource_model_nodes" "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" %}".replace("aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa", graphid)}'
    abac_languages="{% url 'abac_languages' %}"
    abac_controlled_list_items='(listid) => {return "{% url "abac_controlled_list_items" "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" %}".replace("aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa", listid)}'
    abac_resource_sets="{% url 'abac_resource_sets' %}"
    abac_groups="{% url 'abac_groups' %}"
    abac_group='(groupid) => {return "{% url "abac_group" 0 %}".replace(/0$/, groupid)}'
    abac_users="{% url 'abac_users' %}"
    abac_user_group_membership="{% url 'abac_user_group_membership' %}"
></div>
{% endblock arches_urls %}
